name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false
      - name: 验证无依赖演示
        run: node scripts/demo-capability-choice.mjs
      - run: npm ci --ignore-scripts --no-audit --no-fund --cache .cache/npm-cache
      - run: npm test
